schema_version: 1
decisions:
  - id: synthetic-parser-decision
    cve: CVE-2024-0001
    baseline: synthetic-release-1
    rationale: Synthetic historical review assumed FEATURE_X was disabled and the declared source and patch inventory were retained.
    assumptions:
      - id: feature-disabled
        kind: config
        path: build-config.json
        key: FEATURE_X
        expected_present: true
        expected_value: 'n'
      - id: source-retained
        kind: file
        path: src/parser.c
        expected_sha256: '4f27c07bbe11b7e593bb3b9290ddf9a697a1771cf331aedad0ad10b70fcc9166'
      - id: patch-record-retained
        kind: patch
        path: patches.json
        key: synthetic-feature-default
        expected_present: true
        expected_sha256: '696037f8802b168baee59e97178a84782a5f0552b5410126c5e4b3bbf530a4d8'
